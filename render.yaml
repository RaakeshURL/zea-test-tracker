services:
  - type: web
    name: zea-test-tracker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: STORAGE_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: tracker-data
      mountPath: /var/data
      sizeGB: 1
